[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "onepace-mpv"
version = "1.0.0"
description = "Stream a One Pace arc in mpv without downloading - interactive picker, zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Vashistha Pandya" }]
keywords = ["one-pace", "one-piece", "mpv", "pixeldrain", "cli", "streaming"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []  # stdlib only, by design

[project.urls]
Homepage = "https://github.com/vashhdev/onepace"
Issues = "https://github.com/vashhdev/onepace/issues"

[project.scripts]
onepace = "onepace:main"

[tool.setuptools]
py-modules = ["onepace"]
